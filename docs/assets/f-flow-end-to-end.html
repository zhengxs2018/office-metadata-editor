<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>批量对比 · 端到端数据流</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --line:#d8dde3; --ink:#1f2733; --muted:#6b7585;
    --c1:#2563eb; --c2:#0891b2; --c3:#d97706; --c4:#16a34a; --accent:#7c3aed;
    --band:#eef2ff;
  }
  html[data-theme="dark"]{
    --bg:#0e1116; --panel:#161b22; --line:#2b313c; --ink:#e6edf3; --muted:#9aa4b2;
    --c1:#5b9bff; --c2:#34d3e6; --c3:#f5b342; --c4:#4ade80; --accent:#b388ff;
    --band:#1b2030;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);padding:28px}
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
  h1{font-size:19px;margin:0}
  .sub{color:var(--muted);font-size:13px;margin-top:4px}
  .toolbar{display:flex;gap:8px;align-items:center}
  button{cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);
    border-radius:8px;padding:6px 12px;font-size:13px}
  button:hover{border-color:var(--c1)}
  svg{width:100%;height:auto;display:block;background:var(--panel);border:1px solid var(--line);
    border-radius:14px;padding:18px}
  .boxttl{font-size:13px;font-weight:600;fill:var(--ink)}
  .boxlab{font-size:11px;fill:var(--muted)}
  .edge{stroke:var(--muted);stroke-width:1.4;fill:none}
  .elab{font-size:10.5px;fill:var(--muted)}
  .stage{font-size:12px;font-weight:700;fill:var(--accent)}
  .band{fill:var(--band);stroke:var(--line);stroke-dasharray:4 4;rx:12}
  .bandlab{font-size:11px;font-weight:600;fill:var(--muted)}
  .note{font-size:11px;fill:var(--c3);font-style:italic}
</style>
</head>
<body>
<div class="top">
  <div>
    <h1>批量对比 · 端到端数据流</h1>
    <div class="sub">从 UI 点击到内核出结果，再回到渲染/导出 —— 一次操作的完整穿层</div>
  </div>
  <div class="toolbar">
    <button onclick="setTheme('light')">浅色</button>
    <button onclick="setTheme('dark')">深色</button>
    <button onclick="exportSvg('f-flow-end-to-end.svg')">导出 SVG</button>
  </div>
</div>

<svg id="svg" viewBox="0 0 1180 720">
  <!-- 信任边界带 -->
  <rect class="band" x="430" y="40" width="320" height="640" />
  <text class="bandlab" x="448" y="62">IPC 信任边界（invoke）</text>

  <!-- 阶段标注 -->
  <text class="stage" x="40" y="36">前端层（React / 已解析文档）</text>
  <text class="stage" x="780" y="36">Rust 内核层（run_compare 纯函数）</text>

  <!-- 1 用户点击 -->
  <rect x="40" y="70" width="190" height="64" rx="10" fill="var(--panel)" stroke="var(--c1)" stroke-width="1.3"/>
  <text class="boxttl" x="56" y="94">用户点击「开始对比」</text>
  <text class="boxlab" x="56" y="114">canRun = 公司数≥2 且未在对比</text>

  <!-- 2 toCompareInputs -->
  <rect x="40" y="170" width="190" height="74" rx="10" fill="var(--panel)" stroke="var(--c1)" stroke-width="1.3"/>
  <text class="boxttl" x="56" y="194">toCompareInputs</text>
  <text class="boxlab" x="56" y="212">LoadedDocument[]</text>
  <text class="boxlab" x="56" y="230">→ CompareFileInput[]</text>

  <!-- 3 invoke -->
  <rect x="470" y="180" width="200" height="56" rx="10" fill="var(--panel)" stroke="var(--accent)" stroke-width="1.4"/>
  <text class="boxttl" x="486" y="204">invoke('compare_metadata')</text>
  <text class="boxlab" x="486" y="224">{ files: CompareFileInput[] }</text>

  <!-- 4 命令 -->
  <rect x="780" y="180" width="200" height="56" rx="10" fill="var(--panel)" stroke="var(--c2)" stroke-width="1.3"/>
  <text class="boxttl" x="796" y="204">compare_metadata 命令</text>
  <text class="boxlab" x="796" y="224">透传 + 默认值兜底</text>

  <!-- 5 run_compare 外框 -->
  <rect x="780" y="270" width="360" height="330" rx="12" fill="var(--band)" stroke="var(--c2)" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text class="boxttl" x="796" y="292" style="fill:var(--c2)">run_compare（纯函数，无 IO）</text>

  <!-- 5a align -->
  <rect x="800" y="306" width="320" height="58" rx="9" fill="var(--panel)" stroke="var(--c2)" stroke-width="1.1"/>
  <text class="boxttl" x="816" y="328">① 对齐 align_files</text>
  <text class="boxlab" x="816" y="348">文件名/标题/公司 → 归组 + unmatched</text>

  <!-- 5b diff -->
  <rect x="800" y="378" width="320" height="58" rx="9" fill="var(--panel)" stroke="var(--c2)" stroke-width="1.1"/>
  <text class="boxttl" x="816" y="400">② 差异 diff_group ×N组</text>
  <text class="boxlab" x="816" y="420">字段状态机：identical/similar/conflict</text>

  <!-- 5c rules -->
  <rect x="800" y="450" width="320" height="58" rx="9" fill="var(--panel)" stroke="var(--c3)" stroke-width="1.3"/>
  <text class="boxttl" x="816" y="472">③ 风险 rules::evaluate</text>
  <text class="boxlab" x="816" y="492">8规则两两打分 + 证据链聚合</text>

  <!-- 5d normalize -->
  <rect x="800" y="522" width="320" height="56" rx="9" fill="var(--panel)" stroke="var(--line)" stroke-width="1.1"/>
  <text class="boxttl" x="816" y="544">④ 归一化 normalize::*（工具层）</text>
  <text class="boxlab" x="816" y="562">被①②③调用：人名指纹/编辑距离/时间桶</text>

  <!-- 6 CompareResult 回程 -->
  <rect x="470" y="470" width="200" height="60" rx="10" fill="var(--panel)" stroke="var(--accent)" stroke-width="1.4"/>
  <text class="boxttl" x="486" y="494">CompareResult（JSON）</text>
  <text class="boxlab" x="486" y="514">groups + findings + companyRisks</text>

  <!-- 7 selectors -->
  <rect x="40" y="560" width="190" height="64" rx="10" fill="var(--panel)" stroke="var(--c4)" stroke-width="1.3"/>
  <text class="boxttl" x="56" y="584">selectors 投影</text>
  <text class="boxlab" x="56" y="604">过滤/排序/折叠（只重组）</text>

  <!-- 8 渲染 -->
  <rect x="40" y="650" width="190" height="50" rx="10" fill="var(--panel)" stroke="var(--c4)" stroke-width="1.3"/>
  <text class="boxttl" x="56" y="680">组件树渲染</text>

  <!-- 9 导出 -->
  <rect x="270" y="650" width="190" height="50" rx="10" fill="var(--panel)" stroke="var(--c4)" stroke-width="1.3"/>
  <text class="boxttl" x="286" y="680">export.ts → Excel</text>

  <!-- edges -->
  <path class="edge" d="M130 134 V170"/>
  <path class="edge" d="M135 244 H470"/> <text class="elab" x="300" y="262">CompareFileInput[]</text>
  <path class="edge" d="M670 208 H780"/>
  <path class="edge" d="M960 236 V270"/>
  <path class="edge" d="M960 364 H800" marker-end=""/> 
  <path class="edge" d="M960 436 H800"/>
  <path class="edge" d="M960 508 H800"/>
  <path class="edge" d="M780 450 H670"/> <text class="elab" x="690" y="464">回程 JSON</text>
  <path class="edge" d="M470 500 H230"/> <text class="elab" x="300" y="518">setResult</text>
  <path class="edge" d="M135 624 V650"/>
  <path class="edge" d="M230 675 H270"/>

  <text class="note" x="40" y="712">内核只消费「已解析语义字段」，不读文件、不碰磁盘；解析复杂度隔离在前端资源层。</text>
</svg>

<script>
function setTheme(t){document.documentElement.setAttribute('data-theme',t)}
function exportSvg(name){
  const svg=document.getElementById('svg').outerHTML;
  const blob=new Blob([svg],{type:'image/svg+xml'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();
}
setTheme('light');
</script>
</body>
</html>
